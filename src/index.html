<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PBNG Launcher</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0E0F14;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
    .drag{position:absolute;top:0;left:0;right:0;height:32px;-webkit-app-region:drag}
    .card{background:#1a1d27;border-radius:16px;padding:40px;text-align:center;width:400px;border:1px solid #2a2d3a}
    h1{font-size:28px;margin-bottom:10px;color:#FFC700}
    p{color:#8b8fa3;margin-bottom:30px}
    button{background:#FFC700;color:#000;border:none;padding:14px 32px;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;width:100%;margin-bottom:10px}
    button:disabled{opacity:0.5}
    button.secondary{background:#2a2d3a;color:#fff}
    .ver{margin-top:20px;font-size:12px;color:#555}
    .topbar{position:absolute;top:10px;right:10px;display:flex;gap:8px;-webkit-app-region:no-drag}
    .topbar span{cursor:pointer;padding:4px 10px;background:#2a2d3a;border-radius:6px}
  </style>
</head>
<body>
  <div class="drag"></div>
  <div class="topbar">
    <span id="min">—</span>
    <span id="close">✕</span>
  </div>
  <div class="card">
    <h1>PBNG LAUNCHER</h1>
    <p id="status">Anti-Cheat: CLEAN ✓</p>
    <button id="play">PLAY POINT BLANK</button>
    <button class="secondary" id="check">CHECK FILES</button>
    <div class="ver">v<span id="ver">18.2.0</span></div>
  </div>
<script>
  const playBtn = document.getElementById('play');
  const checkBtn = document.getElementById('check');
  const status = document.getElementById('status');
  
  document.getElementById('close').onclick = () => window.pbng.close();
  document.getElementById('min').onclick = () => window.pbng.minimize();

  window.pbng.getVersion().then(v => document.getElementById('ver').innerText = v);

  playBtn.onclick = async () => {
    playBtn.disabled = true;
    status.innerText = "Launching...";
    const res = await window.pbng.startGame();
    if(!res.success) status.innerText = res.message;
    else status.innerText = "Game Running!";
    playBtn.disabled = false;
  };

  checkBtn.onclick = async () => {
    status.innerText = "Checking files...";
    const res = await window.pbng.checkFiles();
    status.innerText = res.msg;
  };
</script>
</body>
</html>
