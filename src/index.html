<!DOCTYPE html>

<style>

  body{background:#0E0F14;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}

  .left{width:320px;background:#121319;border-right:1px solid #1E2028;padding:16px}

  .bottom{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;gap:12px}

  .footer{height:44px;background:#111216;border-top:1px solid #1E2028;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:10px;color:#8A8D9A}
