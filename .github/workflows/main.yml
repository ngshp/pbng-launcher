name: Build PBNG Launcher EXE Portable
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build EXE
        run: npx electron-builder --win portable --x64 --publish never
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-EXE
          path: dist/*.exe
