name: Build PBNG Launcher EXE Portable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build EXE Portable
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist
        run: dir dist
        shell: cmd

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-EXE-v18.2.0
          path: dist/*.exe
          retention-days: 30
