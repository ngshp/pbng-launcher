name: Build & Release PBNG Launcher
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Create icon if missing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          if (!(Test-Path "build/icon.ico")) {
            Write-Host "Icon missing, will build without icon first to get default, then continue..."
          }
          dir build

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Build EXE
        run: |
          npx electron-builder --win portable --x64 --publish never --log
        shell: cmd

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: PBNG Launcher v${{ steps.ver.outputs.VERSION }}
          files: dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
