name: Build & Release PBNG Launcher
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Auto-fix build/icon.ico
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          if (Test-Path "build/icon.ico") { Write-Host "build/icon.ico OK" }
          elseif (Test-Path "pbng_icon.ico") { Copy-Item "pbng_icon.ico" "build/icon.ico" -Force; Write-Host "Copied pbng_icon.ico" }
          elseif (Test-Path "icon.ico") { Copy-Item "icon.ico" "build/icon.ico" -Force; Write-Host "Copied icon.ico" }
          elseif (Test-Path "icon.png") { Copy-Item "icon.png" "build/icon.ico" -Force; Write-Host "Copied icon.png as ico" }
          else { Write-Host "No icon found - building with default" }
          dir build
          dir

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Build EXE
        run: npx electron-builder --win portable --x64 --publish never
        shell: cmd

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: PBNG Launcher v${{ steps.ver.outputs.VERSION }}
          files: dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
