name: Build & Release PBNG Launcher
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install deps
        run: npm install
      - name: Check files
        run: |
          echo "Checking structure..."
          dir
          if not exist build mkdir build
          if not exist src mkdir src
          if not exist src\index.html echo ^<html^>^<body^>PBNG Launcher Loading...^</body^>^</html^> > src\index.html
          if not exist preload.js echo // preload > preload.js
        shell: cmd
      - name: Build
        run: npx electron-builder --win portable nsis --x64 --publish never --config.directories.buildResources=build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        shell: bash
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: PBNG Launcher v${{ steps.version.outputs.VERSION }}
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
