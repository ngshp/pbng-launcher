name: Build & Release PBNG Launcher
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fix icon
        run: |
          if not exist build mkdir build
          copy /Y pbng_icon.ico build\icon.ico
          copy /Y icon.png build\icon.png
        shell: cmd
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build portable
        run: npx electron-builder --win portable --x64 --publish never --config.win.icon=build/icon.ico
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: PBNG Launcher v${{ steps.version.outputs.VERSION }}
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
